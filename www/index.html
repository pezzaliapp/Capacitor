<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Donkey Kong — pezzaliAPP</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    html,body{margin:0;background:#000;touch-action:none;overscroll-behavior:none}
    #hud{position:fixed;inset:auto 0 0 0;display:flex;gap:.75rem;justify-content:center;align-items:center;padding:.75rem}
    .btn{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:.6rem 1rem;font:600 14px system-ui, -apple-system, Segoe UI;backdrop-filter:blur(6px)}
    .btn:active{transform:scale(.98)}
    @media (pointer:coarse){
      #hud{display:flex}
    }
    @media (pointer:fine){
      #hud{display:none}
    }
  </style>
</head>
<body>
  <canvas id="myCanvas"></canvas>

  <!-- On-screen controls for mobile -->
  <div id="hud" aria-hidden="true">
    <button class="btn" data-k="a">◀︎</button>
    <button class="btn" data-k="d">▶︎</button>
    <button class="btn" data-k="w">▲</button>
    <button class="btn" data-k="s">▼</button>
    <button class="btn" data-k="space">JUMP</button>
    <button class="btn" data-k="p">PAUSE</button>
  </div>

  <script type="module" src="./mobile-bridge.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
